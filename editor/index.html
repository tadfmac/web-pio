<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
<link rel="apple-touch-icon" type="image/png" href="/imgs/icons/web-pio-logo-180x180.png">
<link rel="icon" type="image/png" href="/imgs/icons/web-pio-logo-192x192.png">
<title>web-pio editor</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  overflow-x: hidden;
  max-width: 100%;
}

:root {
  --color-page-bg:          #e8f5e9;
  --color-titlebar-bg:      #e8f5e9;
  --color-btn-bg:           #ffffff;
  --color-btn-border:       #b0bfc0;
  --color-btn-emu-bg:       #4caf50;
  --color-btn-emu-txt:      #ffffff;
  --color-panel-hdr:        #c8e6c9;
  --color-panel-hdr-txt:    #1b5e20;
  --color-editor-bg:        #ffffff;
  --color-panel-body:       #ffffff;
  --color-border:           #b0bfc0;
  --color-dropdown-bg:      #ffffff;
  --color-dropdown-border:  #b0bfc0;
  --color-dropdown-hover:   #f1f8e9;
  --color-dialog-bg:        #e8f5e9;
  --color-dialog-border:    #b0bfc0;
  --color-btn-ok-bg:        #f48fb1;
  --color-btn-ok-hover:     #f06292;
  --color-btn-ok-txt:       #ffffff;
  --color-btn-cancel-bg:    #fff176;
  --color-btn-cancel-hover: #ffee58;
  --color-btn-cancel-txt:   #555555;
  --titlebar-h:             44px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  background: var(--color-page-bg);
  height: 100vh;
  overflow: hidden;
  display: grid;
  grid-template-rows: var(--titlebar-h) 1fr;
  max-width: 100vw;
}

/* ---- Titlebar ---- */
#titlebar {
  height: var(--titlebar-h);
  background: var(--color-titlebar-bg);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  gap: 6px;
  position: relative;
  z-index: 100;
  flex-shrink: 0;
}

#titlebar-left {
  display: flex;
  align-items: center;
  gap: 5px;
}

#logo {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-right: 6px;
  font-weight: 600;
  font-size: 13px;
  color: #2e7d32;
  white-space: nowrap;
  user-select: none;
}

#logo img {
  height: 36px;
  width: auto;
}

#version {
  position:absolute;
  bottom:0px;
  right:0px;
  padding:2px 4px;
  background-color:rgba(0,0,0,0.6);
  font-size: 10px;
  color: white;
  white-space: nowrap;
  user-select: none;
}

/* ---- Toolbar buttons ---- */
.tb-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 9px;
  background: var(--color-btn-bg);
  border: 1px solid var(--color-btn-border);
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  color: #333;
  white-space: nowrap;
  user-select: none;
  line-height: 1;
}

.tb-btn:hover {
  background: var(--color-btn-emu-bg);
  border-color: #388e3c;
  color: #ffffff;
}

.tb-btn:hover .icon {
  filter: brightness(0) invert(1);
}

.tb-btn:active {
  background: #43a047;
  border-color: #2e7d32;
  color: #ffffff;
}

.tb-btn .icon {
  width: 15px;
  height: 15px;
  display: block;
  flex-shrink: 0;
}

/* ---- Dropdown ---- */
.dd-wrap {
  position: relative;
}

.dropdown {
  position: absolute;
  top: calc(100% + 3px);
  left: 0;
  background: var(--color-dropdown-bg);
  border: 1px solid var(--color-dropdown-border);
  border-radius: 4px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.13);
  z-index: 300;
  display: none;
  min-width: 90px;
}

.dropdown.open {
  display: flex;
}

.dd-col {
  display: flex;
  flex-direction: column;
  min-width: 90px;
}

.dd-col + .dd-col {
  border-left: 1px solid var(--color-dropdown-border);
  min-width: 120px;
}

.dd-col:empty {
  display: none;
}

.dd-item {
  padding: 7px 14px;
  cursor: pointer;
  color: #333;
  white-space: nowrap;
  font-size: 12px;
  user-select: none;
}

.dd-item:hover {
  background: var(--color-dropdown-hover);
}

.dd-item.selected {
  background: #e8f5e9;
  font-weight: 600;
  color: #1b5e20;
}

.dd-item.remove-emu {
  color: #999;
  font-size: 11px;
}

/* ---- Main layout ---- */
#main {
  display: flex;
  flex-direction: row;
  overflow: hidden;
  min-height: 0;
}

/* ---- Code panel (left) ---- */
#code-panel {
  flex: 1 1 0;
  min-width: 200px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

/* ---- Right column ---- */
#right-col {
  flex: 0 0 auto;
  min-width: 180px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

/* ---- Common panel ---- */
.panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

#gpio-panel {
  flex: 0 0 auto;
}

#i2c-panel {
  flex: 0 0 auto;
}

#log-panel {
  flex: 1 1 0;
  min-height: 60px;
}

/* ---- Splitters ---- */
.splitter-v {
  flex: 0 0 5px;
  background: var(--color-border);
  cursor: col-resize;
  transition: background 0.12s;
  z-index: 10;
}

.splitter-v:hover, .splitter-v.dragging {
  background: #66bb6a;
}

.splitter-h {
  flex: 0 0 5px;
  flex-shrink: 0;
  background: var(--color-border);
  cursor: row-resize;
  transition: background 0.12s;
  z-index: 10;
}

.splitter-h:hover, .splitter-h.dragging {
  background: #66bb6a;
}

.panel-header {
  background: var(--color-panel-hdr);
  color: var(--color-panel-hdr-txt);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  user-select: none;
}

.panel-filename {
  font-weight: 400;
  color: #558b2f;
  font-size: 11px;
}

.panel-body {
  flex: 1;
  overflow: auto;
  background: var(--color-panel-body);
  position: relative;
  min-height: 0;
}

/* ---- Code editor ---- */
#editor-wrap {
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

#editor-wrap .cm-editor {
  height: 100%;
  font-size: 14px;
  background: var(--color-editor-bg);
}

#editor-wrap .cm-scroller {
  font-family: "Fira Code", "Cascadia Code", "Consolas", "Menlo", monospace;
  overflow: auto;
}

/* ---- GPIO / Bridge iframe ---- */
#bridge-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: none;
}

#bridge-frame.visible {
  display: block;
}

.empty-msg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #aaa;
  font-size: 11px;
  text-align: center;
  padding: 8px;
  white-space: nowrap;
  pointer-events: none;
}

/* ---- Log panel ---- */
#log-body {
  padding: 4px 2px;
  font-family: "Fira Code", "Cascadia Code", "Consolas", "Menlo", monospace;
  font-size: 11px;
}

#log-body p {
  margin: 0;
  padding: 1px 6px;
  border-bottom: 1px solid #f5f5f5;
  color: #333;
  word-break: break-all;
}

#log-body p.log-error { color: #c00; }
#log-body p.log-warn  { color: #e65100; }

/* ---- Save dialog ---- */
#dialog-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
}

#dialog-overlay.open {
  display: flex;
}

.dialog-box {
  background: var(--color-dialog-bg);
  border: 1px solid var(--color-dialog-border);
  border-radius: 8px;
  padding: 22px 26px;
  min-width: 300px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.18);
}

.dialog-box h3 {
  font-size: 13px;
  font-weight: 600;
  color: #1b5e20;
  margin-bottom: 14px;
}

.dialog-box label {
  display: block;
  font-size: 11px;
  color: #666;
  margin-bottom: 5px;
}

.dialog-box input[type="text"] {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid var(--color-btn-border);
  border-radius: 4px;
  font-size: 13px;
  font-family: "Fira Code", "Cascadia Code", "Consolas", monospace;
  background: #fff;
  margin-bottom: 18px;
  outline: none;
}

.dialog-box input[type="text"]:focus {
  border-color: #66bb6a;
}

.dialog-buttons {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.dialog-buttons button {
  padding: 7px 20px;
  border-radius: 4px;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  font-weight: 500;
}

#btn-save-ok {
  background: var(--color-btn-ok-bg);
  color: var(--color-btn-ok-txt);
}

#btn-save-ok:hover {
  background: var(--color-btn-ok-hover);
}

#btn-save-cancel {
  background: var(--color-btn-cancel-bg);
  color: var(--color-btn-cancel-txt);
}

#btn-save-cancel:hover {
  background: var(--color-btn-cancel-hover);
}
#talogo{
  width:24px;
  height:24px;
  background-repeat: no-repeat;
  background-image: url(/imgs/icon.png);
  background-position: center;
  background-size: contain;
}
#ghlogo{
  width:24px;
  height:24px;
  background-repeat: no-repeat;
  background-image: url(/imgs/github-logo.png);
  background-position: center;
  background-size: contain;
}
#talinkswrap{
  display:flex;
  gap:10px;
}

/* ---- Unsupported browser overlay ---- */
#browser-block {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
}

#browser-block .block-box {
  background: #fff8e1;
  border: 2px solid #ff9800;
  border-radius: 10px;
  padding: 36px 40px;
  max-width: 440px;
  text-align: center;
  box-shadow: 0 10px 32px rgba(0,0,0,0.28);
}

#browser-block .block-box h2 {
  font-size: 15px;
  font-weight: 700;
  color: #e65100;
  margin-bottom: 14px;
}

#browser-block .block-box p {
  font-size: 13px;
  color: #555;
  line-height: 1.7;
}

/* ---- Hamburger button (mobile only) ---- */
#hamburger-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 24px;
  color: #2e7d32;
  flex-shrink: 0;
  line-height: 1;
  padding: 0;
  user-select: none;
}

/* ---- Sidemenu overlay ---- */
#sidemenu-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
}

#sidemenu-overlay.open {
  display: block;
}

/* ---- Sidemenu panel ---- */
#sidemenu {
  position: fixed;
  top: 0;
  right: -280px;
  width: 260px;
  height: 100%;
  background: #fff;
  z-index: 210;
  transition: right 0.22s ease;
  overflow-y: auto;
  box-shadow: -4px 0 20px rgba(0,0,0,0.18);
  display: flex;
  flex-direction: column;
}

#sidemenu.open {
  right: 0;
}

#sidemenu-header {
  height: var(--titlebar-h);
  background: var(--color-titlebar-bg);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 14px;
  font-weight: 600;
  font-size: 13px;
  color: #2e7d32;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 1;
}

.sm-section-label {
  padding: 5px 14px;
  font-size: 10px;
  font-weight: 700;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  background: #f5f5f5;
  border-bottom: 1px solid #ececec;
  user-select: none;
}

.sm-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 14px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  font-size: 13px;
  color: #333;
  user-select: none;
}

.sm-row:hover, .sm-row:active {
  background: #f1f8e9;
}

.sm-row.sm-expand {
  justify-content: space-between;
}

.sm-row .sm-chevron {
  font-size: 10px;
  color: #bbb;
  transition: transform 0.15s;
  flex-shrink: 0;
}

.sm-row.sm-open .sm-chevron {
  transform: rotate(90deg);
}

.sm-row .sm-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.sm-sub {
  display: none;
  background: #fafff9;
}

.sm-sub.sm-open {
  display: block;
}

.sm-sub-row {
  padding: 9px 14px 9px 38px;
  border-bottom: 1px solid #f0f0f0;
  cursor: pointer;
  font-size: 12px;
  color: #555;
  user-select: none;
}

.sm-sub-row:hover, .sm-sub-row:active {
  background: #e8f5e9;
}

.sm-sub-cat {
  padding: 8px 14px 8px 24px;
  border-bottom: 1px solid #e0eed0;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  color: #1b5e20;
  background: #f0f9f0;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 6px;
}

.sm-sub-cat:hover, .sm-sub-cat:active {
  background: #d8f0da;
}

.sm-sub-cat .sm-chevron {
  font-size: 9px;
  color: #bbb;
  transition: transform 0.15s;
}

.sm-sub-cat.sm-open .sm-chevron {
  transform: rotate(90deg);
}

.sm-file-row {
  display: none;
  padding: 7px 14px 7px 50px;
  border-bottom: 1px solid #f0f0f0;
  cursor: pointer;
  font-size: 12px;
  color: #555;
  user-select: none;
}

.sm-file-row.sm-open {
  display: block;
}

.sm-file-row:hover, .sm-file-row:active {
  background: #e8f5e9;
}

.sm-remove-emu {
  color: #aaa;
  font-size: 11px;
}

.sm-links {
  display: flex;
  gap: 16px;
  padding: 12px 14px;
  border-bottom: 1px solid #eee;
}

.sm-links a {
  display: flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  color: #555;
  font-size: 12px;
}

/* ---- Responsive: smartphone ---- */
@media (max-width: 767px) {
  body {
    overflow-x: hidden;
    overflow-y: auto;
    height: auto;
    min-height: 100vh;
    max-width: 100vw;
  }

  #hamburger-btn {
    display: flex;
    flex-shrink: 0;
  }

  #titlebar-left > *:not(#logo) {
    display: none !important;
  }

  /* titlebar-left: ロゴだけ残るので flex で縮めてハンバーガーを押し出さない */
  #titlebar-left {
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
  }

  #logo {
    min-width: 0;
    flex-shrink: 1;
    overflow: hidden;
  }

  #talinkswrap {
    display: none;
  }

  /* main: 縦1列、横は画面内に収める */
  #main {
    flex-direction: column;
    overflow-x: hidden;
    overflow-y: visible;
    height: auto;
    max-width: 100%;
  }

  /* モバイルでは splitter-v を水平スプリッター（code ↔ GPIO）として再利用 */
  #splitter-v {
    cursor: row-resize;
    touch-action: none;
  }

  #code-panel {
    width: 100% !important;
    min-width: 0 !important;
    max-width: 100%;
    height: 50vh;
    min-height: 220px;
    flex: none;
  }

  #right-col {
    width: 100% !important;
    min-width: 0 !important;
    max-width: 100%;
    flex: none;
    height: auto;
    overflow-x: hidden;
    overflow-y: visible;
  }

  #gpio-panel {
    height: 75vw;
    min-height: 220px;
    max-width: 100%;
  }

  #i2c-panel {
    height: 160px;
    max-width: 100%;
  }

  #log-panel {
    height: 200px;
    flex: none;
    max-width: 100%;
  }

  /* バージョン表示: fixed でスクロール位置に関係なく画面最下部に固定 */
  #version {
    position: fixed;
    bottom: 0;
    right: 0;
    z-index: 50;
  }
}
</style>
</head>
<body>

<header id="titlebar">
<div id="titlebar-left">
<div id="logo">
<img src="/imgs/icons/web-pio-logo2.png" alt="web-pio">
editor
</div>

<!-- examples -->
<div class="dd-wrap" id="wrap-examples">
<button class="tb-btn" id="btn-examples">
<img class="icon" src="/imgs/icons/led-on.svg" alt="">
examples
</button>
<div class="dropdown" id="dd-examples">
<div class="dd-col" id="dd-cat">
<div class="dd-item" data-cat="gpio">GPIO</div>
<div class="dd-item" data-cat="i2c">I2C</div>
</div>
<div class="dd-col" id="dd-files"></div>
</div>
</div>

<!-- your works -->
<div class="dd-wrap" id="wrap-works">
<button class="tb-btn" id="btn-works">
<img class="icon" src="/imgs/icons/wrench.svg" alt="">
Your works
</button>
<div class="dropdown" id="dd-works">
<div class="dd-col" id="dd-works-list"></div>
</div>
</div>

<!-- refresh -->
<button class="tb-btn" id="btn-refresh">
<img class="icon" src="/imgs/icons/refresh.svg" alt="">
refresh
</button>

<!-- emulator -->
<div class="dd-wrap" id="wrap-emulator">
<button class="tb-btn" id="btn-emulator">
<img class="icon" src="/imgs/icons/raspberry-pi.svg" alt="">
emulator
</button>
<div class="dropdown" id="dd-emulator">
<div class="dd-col" id="dd-emu-list"></div>
</div>
</div>

<!-- save -->
<button class="tb-btn" id="btn-save">
<img class="icon" src="/imgs/icons/content-save.svg" alt="">
save
</button>

<!-- download -->
<button class="tb-btn" id="btn-download">
<img class="icon" src="/imgs/icons/download.svg" alt="">
download
</button>

</div>
<div id="talinkswrap">
<a href="https://mz4u.net"><div id="talogo"></div></a>
<a href="https://github.com/tadfmac/web-pio"><div id="ghlogo"></div></a>
</div>
<button id="hamburger-btn" aria-label="Menu">&#9776;</button>
</header>

<main id="main">

<section id="code-panel" class="panel">
<div class="panel-header">
code
<span class="panel-filename" id="filename-display"></span>
</div>
<div id="editor-wrap"></div>
</section>

<div id="splitter-v" class="splitter-v"></div>

<aside id="right-col">

<section id="gpio-panel" class="panel">
<div class="panel-header">GPIO emulator</div>
<div class="panel-body" id="gpio-body">
<iframe id="bridge-frame" src="/editor/bridge.html" allow="midi"></iframe>
<p class="empty-msg" id="gpio-empty">Any emulator hasn't loaded yet.</p>
</div>
</section>

<div id="splitter-h1" class="splitter-h"></div>

<section id="i2c-panel" class="panel">
<div class="panel-header">I2C emulator</div>
<div class="panel-body">
<p class="empty-msg">The I2C emulator has not yet been implemented.</p>
</div>
</section>

<div id="splitter-h2" class="splitter-h"></div>

<section id="log-panel" class="panel">
<div class="panel-header">Logs</div>
<div class="panel-body" id="log-body"></div>
</section>

</aside>
<div id="version">v0.2.0</div>
</main>

<!-- Sidemenu overlay -->
<div id="sidemenu-overlay"></div>

<!-- Sidemenu panel -->
<div id="sidemenu">
<div id="sidemenu-header">Menu</div>
<div id="sidemenu-content"></div>
</div>

<!-- hidden run iframe -->
<iframe id="run-frame" allow="midi" style="display:none; position:absolute; width:0; height:0; border:0;"></iframe>

<!-- save dialog -->
<div id="dialog-overlay">
<div class="dialog-box">
<h3>Save to Your works</h3>
<label for="save-filename">File name:</label>
<input type="text" id="save-filename" placeholder="filename.mjs" spellcheck="false">
<div class="dialog-buttons">
<button id="btn-save-cancel">Cancel</button>
<button id="btn-save-ok">Save</button>
</div>
</div>
</div>

<!-- unsupported browser overlay -->
<div id="browser-block">
<div class="block-box">
<h2>⚠ Unsupported Browser</h2>
<p>This browser does not support the Web MIDI API.<br>
Please use Chrome or a compatible browser.</p>
</div>
</div>

<script type="module">
import { checkmidi } from "/src/checkmidi.mjs";
import savezip from "./savezip.mjs";

if (!checkmidi()) {
  document.getElementById("browser-block").style.display = "flex";
}

import {EditorView, basicSetup, javascript} from "/editor/lib/codemirror.bundle.js";

// ---- constants ----
const LS_PREFIX = "pio-editor:";
const BRIDGE_SRC = "/editor/bridge.html";

const EXAMPLES = {
  gpio: ["adc", "blink", "input", "pwm"],
  i2c: [
    "adt7410", "detect", "sht40",
    "ssd1306-32", "ssd1306-64",
    "ssd1315-32", "ssd1315-40", "ssd1315-64",
    "vl53l0x"
  ]
};

const EMULATORS = [
  {label: "XIAO RP2040",         name: "pio_xiaoRP2040-emu001"},
  {label: "XIAO RP2350",         name: "pio_xiaoRP2350-emu001"},
  {label: "Raspi Pico",          name: "pio_RaspiPico-emu001"},
  {label: "Raspi Pico 2",        name: "pio_RaspiPico2-emu001"},
  {label: "XIAO ESP32C6",        name: "pio_xiaoESP32C6-emu001"},
  {label: "— remove emulator —", name: null}
];

// ---- state ----
let currentEmulator = null;
let currentFilePath = "";
let currentFileName = "";
let debounceTimer = null;
let bridgeReady = false;

// ---- DOM refs ----
const runFrame      = document.getElementById("run-frame");
const bridgeFrame   = document.getElementById("bridge-frame");
const logBody       = document.getElementById("log-body");
const filenameDisp  = document.getElementById("filename-display");
const gpioEmpty     = document.getElementById("gpio-empty");
const dialogOverlay = document.getElementById("dialog-overlay");
const saveFilenameEl = document.getElementById("save-filename");

// ---- CodeMirror ----
const editor = new EditorView({
  doc: "// Welcome to web-pio editor!\n// Select an example from the \"examples\" menu or write your own code.\n",
  extensions: [
    basicSetup,
    javascript(),
    EditorView.updateListener.of(update => {
      if (!update.docChanged) return;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => rebuildRunFrame(), 2000);
    })
  ],
  parent: document.getElementById("editor-wrap")
});

function getCode() {
  return editor.state.doc.toString();
}

function setCode(code) {
  editor.dispatch({
    changes: {from: 0, to: editor.state.doc.length, insert: code}
  });
}

// ---- dropdown helpers ----
let activeWrap = null;

function closeAll() {
  document.querySelectorAll(".dropdown.open").forEach(d => d.classList.remove("open"));
  activeWrap = null;
}

function toggleDd(ddEl, wrapEl) {
  const wasOpen = ddEl.classList.contains("open");
  closeAll();
  if (!wasOpen) {
    ddEl.classList.add("open");
    activeWrap = wrapEl;
  }
}

document.addEventListener("click", e => {
  if (activeWrap && !activeWrap.contains(e.target)) {
    closeAll();
  }
});

// ---- examples dropdown ----
const ddExamples = document.getElementById("dd-examples");
const ddCat      = document.getElementById("dd-cat");
const ddFiles    = document.getElementById("dd-files");
const wrapEx     = document.getElementById("wrap-examples");

document.getElementById("btn-examples").addEventListener("click", e => {
  e.stopPropagation();
  ddFiles.innerHTML = "";
  ddCat.querySelectorAll(".dd-item").forEach(i => i.classList.remove("selected"));
  toggleDd(ddExamples, wrapEx);
});

ddCat.querySelectorAll(".dd-item").forEach(item => {
  item.addEventListener("click", e => {
    e.stopPropagation();
    const cat = item.dataset.cat;
    ddCat.querySelectorAll(".dd-item").forEach(i => i.classList.remove("selected"));
    item.classList.add("selected");
    ddFiles.innerHTML = "";
    EXAMPLES[cat].forEach(name => {
      const div = document.createElement("div");
      div.className = "dd-item";
      div.textContent = name;
      div.addEventListener("click", () => {
        closeAll();
        loadExample(cat, name);
      });
      ddFiles.appendChild(div);
    });
  });
});

function stripHeaderComment(code) {
  return code.replace(/^(\/\/[^\n]*\n)+/, "").trimStart();
}

async function loadExample(cat, name) {
  const path = `examples/js/${cat}/${name}.mjs`;
  try {
    const res = await fetch(`/${path}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const code = stripHeaderComment(await res.text());
    currentFilePath = path;
    currentFileName = `${name}.mjs`;
    filenameDisp.textContent = currentFileName;
    setCode(code);
    clearTimeout(debounceTimer);
    clearLog();
    rebuildRunFrame();
  } catch (err) {
    appendLog("error", `Failed to load: ${name}.mjs (${err.message})`);
  }
}

// ---- your works dropdown ----
const ddWorks     = document.getElementById("dd-works");
const ddWorksList = document.getElementById("dd-works-list");
const wrapWorks   = document.getElementById("wrap-works");

document.getElementById("btn-works").addEventListener("click", e => {
  e.stopPropagation();
  buildWorksList();
  toggleDd(ddWorks, wrapWorks);
});

function buildWorksList() {
  ddWorksList.innerHTML = "";
  const keys = Object.keys(localStorage)
    .filter(k => k.startsWith(LS_PREFIX))
    .sort();
  if (keys.length === 0) {
    const div = document.createElement("div");
    div.className = "dd-item";
    div.textContent = "(empty)";
    div.style.color = "#aaa";
    div.style.cursor = "default";
    ddWorksList.appendChild(div);
    return;
  }
  keys.forEach(key => {
    const filename = key.slice(LS_PREFIX.length);
    const div = document.createElement("div");
    div.className = "dd-item";
    div.textContent = filename;
    div.addEventListener("click", () => {
      closeAll();
      loadWork(key, filename);
    });
    ddWorksList.appendChild(div);
  });
}

function loadWork(key, filename) {
  const raw = localStorage.getItem(key);
  if (raw === null) return;
  let code, filePath;
  try {
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object" && typeof parsed.code === "string") {
      // 新形式: {code, filePath}
      code = parsed.code;
      filePath = parsed.filePath || "";
    } else {
      throw new Error("not our format");
    }
  } catch {
    // 旧形式: plain code string（後方互換）
    code = raw;
    filePath = "";
  }
  currentFilePath = filePath;
  currentFileName = filename;
  filenameDisp.textContent = filename;
  setCode(code);
  clearTimeout(debounceTimer);
  clearLog();
  rebuildRunFrame();
}

// ---- refresh ----
document.getElementById("btn-refresh").addEventListener("click", async () => {
  clearLog();
  if (currentEmulator) {
    bridgeReady = false;
    bridgeFrame.src = BRIDGE_SRC;
    await new Promise(r => bridgeFrame.addEventListener("load", r, {once: true}));
    bridgeReady = true;
  }
  rebuildRunFrame();
});

// ---- emulator dropdown ----
const ddEmulator = document.getElementById("dd-emulator");
const ddEmuList  = document.getElementById("dd-emu-list");
const wrapEmu    = document.getElementById("wrap-emulator");

EMULATORS.forEach(emu => {
  const div = document.createElement("div");
  div.className = emu.name === null ? "dd-item remove-emu" : "dd-item";
  div.textContent = emu.label;

  ddEmuList.appendChild(div);

document.getElementById("btn-emulator").addEventListener("click", e => {
  e.stopPropagation();
  toggleDd(ddEmulator, wrapEmu);
});

async function selectEmulator(name) {
  currentEmulator = name;
  if (name) {
    gpioEmpty.style.display = "none";
    bridgeFrame.classList.add("visible");
    // エミュレータ切替のたびにブリッジをリロードしてクリーンな状態にする
    bridgeReady = false;
    bridgeFrame.src = BRIDGE_SRC;
    await new Promise(r => bridgeFrame.addEventListener("load", r, {once: true}));
    bridgeReady = true;
  } else {
    bridgeFrame.classList.remove("visible");
    gpioEmpty.style.display = "";
  }
  rebuildRunFrame();
}

// ---- save ----
document.getElementById("btn-save").addEventListener("click", () => {
  saveFilenameEl.value = currentFileName || "script.mjs";
  dialogOverlay.classList.add("open");
  saveFilenameEl.focus();
  saveFilenameEl.select();
});

document.getElementById("btn-save-cancel").addEventListener("click", () => {
  dialogOverlay.classList.remove("open");
});

document.getElementById("btn-save-ok").addEventListener("click", doSave);

saveFilenameEl.addEventListener("keydown", e => {
  if (e.key === "Enter") doSave();
  if (e.key === "Escape") dialogOverlay.classList.remove("open");
});

dialogOverlay.addEventListener("click", e => {
  if (e.target === dialogOverlay) dialogOverlay.classList.remove("open");
});

function doSave() {
  const filename = saveFilenameEl.value.trim();
  if (!filename) return;
  const key = LS_PREFIX + filename;
  if (localStorage.getItem(key) !== null) {
    if (!confirm(`"${filename}" already exists. Overwrite?`)) return;
  }
  // Persist code and filePath as JSON so relative imports resolve correctly on load.
  localStorage.setItem(key, JSON.stringify({code: getCode(), filePath: currentFilePath || ""}));
  currentFileName = filename;
  filenameDisp.textContent = filename;
  dialogOverlay.classList.remove("open");
  appendLog("log", `Saved: ${filename}`);
}

// ---- log ----
function clearLog() {
  logBody.innerHTML = "";
}

function appendLog(level, msg) {
  const p = document.createElement("p");
  const ts = new Date().toLocaleTimeString("en-US", {hour12: false});
  p.textContent = `[${ts}] ${msg}`;
  if (level === "error") p.className = "log-error";
  else if (level === "warn") p.className = "log-warn";
  logBody.appendChild(p);
  logBody.scrollTop = logBody.scrollHeight;
}

// ---- message handling ----
window.addEventListener("message", e => {
  const msg = e.data;
  if (!msg || typeof msg !== "object") return;
  // console output from run-frame
  if (msg.type === "editor-log") {
    appendLog(msg.level || "log", msg.msg || "");
    return;
  }
  // GPIO event relay: bridge-frame (parent=editor) → run-frame
  if (msg.type === "pio-bridge-event") {
    runFrame.contentWindow?.postMessage(msg, "*");
  }
});

// ---- import rewriting ----
function transformImports(code, filePath) {
  const origin = window.location.origin;
  // filePath がない場合はルート "/" をベースにする。
  // ブラウザの URL 正規化により "../../../src/pio.mjs" → "/src/pio.mjs" に解決される。
  const dir = filePath ? filePath.replace(/[^/]+$/, "") : "";
  const base = `${origin}/${dir}`;
  return code.replace(
    /(\bfrom\s+["'])((?:\.\.?\/|\/)[^"'\s]+)(["'])/g,
    (_, pre, rel, post) => {
      try {
        const resolveBase = rel.startsWith("/") ? origin : base;
        return pre + new URL(rel, resolveBase).href + post;
      } catch (_e) {
        return pre + rel + post;
      }
    }
  );
}

// ---- srcdoc generation ----
function generateSrcdoc(code, emulator, filePath) {
  const transformed = transformImports(code, filePath);
  const origin = window.location.origin;
  const pioUrl = JSON.stringify(origin + "/dist/pio.min.mjs");
  const bcdUrl = JSON.stringify(origin + "/src/emulator-bridge-devices.mjs");
  const codeJson = JSON.stringify(transformed);
  const emuJson = JSON.stringify(emulator || "");

  return `<!DOCTYPE html>
<html>
<body>
<script type="module">
["log","warn","error"].forEach(lvl => {
  const _o = console[lvl];
  console[lvl] = (...a) => {
    _o.apply(console, a);
    window.parent.postMessage({type:"editor-log",level:lvl,msg:a.map(String).join(" ")}, "*");
  };
});

const EMULATOR = ${emuJson};
let __BCD = null;
let __bw  = null;

if (EMULATOR) {
  const {default: __Pio} = await import(${pioUrl});
  const {default: _bcd}  = await import(${bcdUrl});
  __BCD = _bcd;
  __bw  = window.parent.document.getElementById("bridge-frame").contentWindow;
  __BCD.init(__bw);
  const __oi = __Pio.prototype.init;
  __Pio.prototype.init = async function(o) {
    const r = await __oi.call(this, o);
    if (!this.emuDevices) {
      this.emuDevices = __BCD;
      __BCD.setOnChange(this._onChangeEmuDevice.bind(this));
    }
    return r;
  };
}

const __code = ${codeJson};
const __blob = new Blob([__code], {type: "application/javascript"});
const __url  = URL.createObjectURL(__blob);
try {
  await import(__url);
} catch(e) {
  console.error(String(e));
} finally {
  URL.revokeObjectURL(__url);
}

if (__BCD && __bw) {
  // REMOVE_DEVICE を bridge に直接送信して前回のデバイスをクリーンアップ
  // (BCD のローカル devices は毎回リセットされるため removeDevice() は使えない)
  __bw.postMessage({type: "pio-bridge", cmd: "REMOVE_DEVICE", device: EMULATOR}, "*");
  await new Promise(r => setTimeout(r, 80));
  try {
    await __BCD.addDevice(EMULATOR);
  } catch(e) {
    console.error("addDevice failed: " + e);
  }
}
<\/script>
</body>
</html>`;
}

// ---- run frame ----
function rebuildRunFrame() {
  const code = getCode().trim();
  if (!code) return;
  const srcdoc = generateSrcdoc(code, currentEmulator, currentFilePath);
  runFrame.srcdoc = srcdoc;
}

// ---- layout: initial sizing ----
// PC レイアウトの初期化が完了したかを示すフラグ。
// モバイルで起動後 PC サイズへ広げた際に再度 initLayout() を呼ぶために使用する。
let pcLayoutDone = false;

function initLayout() {
  if (window.innerWidth <= 767) return;
  const mainEl = document.getElementById("main");
  const rect = mainEl.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const totalW = rect.width;
  const totalH = rect.height;
  const SPLITTER_H = 5;

  // Right column: 32% of total width
  const rightW = Math.round(totalW * 0.32);
  document.getElementById("right-col").style.width = rightW + "px";

  // GPIO: 48%, I2C: 27%, Log gets the rest via flex:1
  const availH = totalH - SPLITTER_H * 2;
  document.getElementById("gpio-panel").style.height = Math.round(availH * 0.48) + "px";
  document.getElementById("i2c-panel").style.height = Math.round(availH * 0.27) + "px";
  pcLayoutDone = true;
}

// モバイルサイズで起動後に PC サイズへ広げた場合、initLayout() が未実行のまま
// パネル高さがゼロになる問題を修正する。
// pcLayoutDone が false（= PC 用インラインサイズが未設定）の状態で
// ウィンドウが PC 幅になった時だけ initLayout() を再実行する。
// デバウンスを入れず resize ハンドラ内で即座に呼ぶことで、
// ブラウザが崩れた状態を描画する前にサイズを確定させ、チラつきを防ぐ。
window.addEventListener("resize", () => {
  if (pcLayoutDone) return;
  if (window.innerWidth > 767) {
    initLayout();
  }
});

// ---- layout: drag splitters ----
// ドラッグ中に全画面を覆う透明オーバーレイ。
// iframe（bridge-frame）がマウスイベントを横取りするのを防ぐ。
const dragOverlay = document.createElement("div");
dragOverlay.style.cssText = "position:fixed;inset:0;z-index:9999;display:none;";
document.body.appendChild(dragOverlay);

// dir は文字列 "v"/"h" または () => "v"/"h" の関数どちらでも可
function makeDragger(splitterEl, opts) {
  const {getStart, apply, min, maxFn} = opts;
  const getDir = typeof opts.dir === "function" ? opts.dir : () => opts.dir;

  function startDrag(startPos, startVal) {
    const dir = getDir();
    splitterEl.classList.add("dragging");
    dragOverlay.style.cursor = dir === "v" ? "col-resize" : "row-resize";
    dragOverlay.style.display = "block";
    document.body.style.userSelect = "none";

    function applyPos(pos) {
      const d = getDir();
      const delta = pos - startPos;
      const raw = d === "v" ? startVal - delta : startVal + delta;
      apply(Math.max(min, Math.min(maxFn(), raw)));
    }

    function onMouseMove(ev) {
      const d = getDir();
      applyPos(d === "v" ? ev.clientX : ev.clientY);
    }
    function onTouchMove(ev) {
      ev.preventDefault();
      const t = ev.touches[0];
      const d = getDir();
      applyPos(d === "v" ? t.clientX : t.clientY);
    }

    function cleanup() {
      splitterEl.classList.remove("dragging");
      dragOverlay.style.display = "none";
      dragOverlay.style.cursor = "";
      document.body.style.userSelect = "";
      dragOverlay.removeEventListener("mousemove", onMouseMove);
      dragOverlay.removeEventListener("mouseup", cleanup);
      document.removeEventListener("touchmove", onTouchMove);
      document.removeEventListener("touchend", cleanup);
    }

    dragOverlay.addEventListener("mousemove", onMouseMove);
    dragOverlay.addEventListener("mouseup", cleanup);
    // タッチはdragOverlayを通さずdocumentで拾う（iframeを跨ぐ必要がないため）
    document.addEventListener("touchmove", onTouchMove, {passive: false});
    document.addEventListener("touchend", cleanup);
  }

  splitterEl.addEventListener("mousedown", e => {
    e.preventDefault();
    const dir = getDir();
    startDrag(dir === "v" ? e.clientX : e.clientY, getStart());
  });

  splitterEl.addEventListener("touchstart", e => {
    e.preventDefault();
    const t = e.touches[0];
    const dir = getDir();
    startDrag(dir === "v" ? t.clientX : t.clientY, getStart());
  }, {passive: false});
}

function initSplitters() {
  const isMobile = () => window.innerWidth <= 767;
  const mainEl    = document.getElementById("main");
  const rightCol  = document.getElementById("right-col");
  const codePanel = document.getElementById("code-panel");
  const gpioPanel = document.getElementById("gpio-panel");
  const i2cPanel  = document.getElementById("i2c-panel");
  const SPLITTER  = 5;

  // splitter-v:
  //   PC    → 縦スプリッター（code 幅 ↔ right-col 幅）
  //   Mobile → 横スプリッター（code 高さ ↔ GPIO 高さ）
  makeDragger(document.getElementById("splitter-v"), {
    dir: () => isMobile() ? "h" : "v",
    getStart: () => isMobile()
      ? codePanel.getBoundingClientRect().height
      : rightCol.getBoundingClientRect().width,
    apply: v => {
      if (isMobile()) {
        codePanel.style.height = v + "px";
      } else {
        rightCol.style.width = v + "px";
      }
    },
    min: 80,
    maxFn: () => isMobile()
      ? window.innerHeight * 0.88
      : mainEl.getBoundingClientRect().width - 200 - SPLITTER
  });

  // Horizontal 1: gpio | i2c+log
  makeDragger(document.getElementById("splitter-h1"), {
    dir: "h",
    getStart: () => gpioPanel.getBoundingClientRect().height,
    apply: v => { gpioPanel.style.height = v + "px"; },
    min: 80,
    maxFn: () => isMobile()
      ? window.innerHeight * 0.88
      : rightCol.getBoundingClientRect().height - 40 - 60 - SPLITTER * 2
  });

  // Horizontal 2: i2c | log
  makeDragger(document.getElementById("splitter-h2"), {
    dir: "h",
    getStart: () => i2cPanel.getBoundingClientRect().height,
    apply: v => { i2cPanel.style.height = v + "px"; },
    min: 24,
    maxFn: () => {
      if (isMobile()) return window.innerHeight * 0.5;
      const rightH = rightCol.getBoundingClientRect().height;
      const gpioH  = gpioPanel.getBoundingClientRect().height;
      return rightH - gpioH - 60 - SPLITTER * 2;
    }
  });
}

// ---- query params ----
async function initFromQuery() {
  const params = new URLSearchParams(window.location.search);
  const exampleParam  = params.get("example");
  const emulatorParam = params.get("emulator");

  if (exampleParam) {
    // "gpio blink" (+ is decoded as space by URLSearchParams)
    const parts = exampleParam.trim().split(/\s+/);
    if (parts.length === 2) {
      const [cat, name] = parts;
      if (EXAMPLES[cat] && EXAMPLES[cat].includes(name)) {
        await loadExample(cat, name);
      }
    }
  }

  if (emulatorParam) {
    // normalize: lowercase + remove non-alphanumeric
    // e.g. "xiaorp2040" matches label "XIAO RP2040" → "xiaorp2040"
    const norm = emulatorParam.toLowerCase().replace(/[^a-z0-9]/g, "");
    const found = EMULATORS.find(e => {
      if (!e.name) return false;
      return e.label.toLowerCase().replace(/[^a-z0-9]/g, "") === norm;
    });
    if (found) {
      await selectEmulator(found.name);
    }
  }
}

// ---- Sidemenu ----
const hamburgerBtn    = document.getElementById("hamburger-btn");
const sidemenuOverlay = document.getElementById("sidemenu-overlay");
const sidemenu        = document.getElementById("sidemenu");
const sidemenuContent = document.getElementById("sidemenu-content");

function openSidemenu() {
  buildSidemenu();
  sidemenu.classList.add("open");
  sidemenuOverlay.classList.add("open");
}

function closeSidemenu() {
  sidemenu.classList.remove("open");
  sidemenuOverlay.classList.remove("open");
}

hamburgerBtn.addEventListener("click", e => {
  e.stopPropagation();
  openSidemenu();
});

sidemenuOverlay.addEventListener("click", closeSidemenu);

function makeSectionLabel(text) {
  const div = document.createElement("div");
  div.className = "sm-section-label";
  div.textContent = text;
  return div;
}

function makeSmRow(iconSrc, text, hasChevron) {
  const div = document.createElement("div");
  div.className = "sm-row" + (hasChevron ? " sm-expand" : "");
  if (iconSrc) {
    const img = document.createElement("img");
    img.className = "sm-icon";
    img.src = iconSrc;
    img.alt = "";
    div.appendChild(img);
  }
  const span = document.createElement("span");
  span.textContent = text;
  span.style.flex = "1";
  div.appendChild(span);
  if (hasChevron) {
    const chev = document.createElement("span");
    chev.className = "sm-chevron";
    chev.textContent = "▶";
    div.appendChild(chev);
  }
  return div;
}

function buildSidemenu() {
  sidemenuContent.innerHTML = "";

  // ---- Examples ----
  sidemenuContent.appendChild(makeSectionLabel("Examples"));
  const exRow = makeSmRow("/imgs/icons/led-on.svg", "examples", true);
  sidemenuContent.appendChild(exRow);
  const exSub = document.createElement("div");
  exSub.className = "sm-sub";

  Object.entries(EXAMPLES).forEach(([cat, files]) => {
    const catRow = document.createElement("div");
    catRow.className = "sm-sub-cat";
    const catChev = document.createElement("span");
    catChev.className = "sm-chevron";
    catChev.textContent = "▶";
    catRow.appendChild(catChev);
    catRow.appendChild(document.createTextNode(cat.toUpperCase()));
    exSub.appendChild(catRow);
    let catOpen = false;
    const fileRows = [];
    files.forEach(name => {
      const fileRow = document.createElement("div");
      fileRow.className = "sm-file-row";
      fileRow.textContent = name;
      fileRow.addEventListener("click", () => {
        closeSidemenu();
        loadExample(cat, name);
      });
      exSub.appendChild(fileRow);
      fileRows.push(fileRow);
    });
    // addEventListener はループ外で1回だけ登録する
    catRow.addEventListener("click", e => {
      e.stopPropagation();
      catOpen = !catOpen;
      catRow.classList.toggle("sm-open", catOpen);
      fileRows.forEach(r => r.classList.toggle("sm-open", catOpen));
    });
  });

  sidemenuContent.appendChild(exSub);
  exRow.addEventListener("click", e => {
    e.stopPropagation();
    const isOpen = exSub.classList.toggle("sm-open");
    exRow.classList.toggle("sm-open", isOpen);
  });

  // ---- Your works ----
  sidemenuContent.appendChild(makeSectionLabel("Your works"));
  const worksRow = makeSmRow("/imgs/icons/wrench.svg", "Your works", true);
  sidemenuContent.appendChild(worksRow);
  const worksSub = document.createElement("div");
  worksSub.className = "sm-sub";
  const wkeys = Object.keys(localStorage).filter(k => k.startsWith(LS_PREFIX)).sort();
  if (wkeys.length === 0) {
    const emptyRow = document.createElement("div");
    emptyRow.className = "sm-sub-row";
    emptyRow.textContent = "(empty)";
    emptyRow.style.color = "#aaa";
    emptyRow.style.cursor = "default";
    worksSub.appendChild(emptyRow);
  } else {
    wkeys.forEach(key => {
      const filename = key.slice(LS_PREFIX.length);
      const row = document.createElement("div");
      row.className = "sm-sub-row";
      row.textContent = filename;
      row.addEventListener("click", () => {
        closeSidemenu();
        loadWork(key, filename);
      });
      worksSub.appendChild(row);
    });
  }
  sidemenuContent.appendChild(worksSub);
  worksRow.addEventListener("click", e => {
    e.stopPropagation();
    const isOpen = worksSub.classList.toggle("sm-open");
    worksRow.classList.toggle("sm-open", isOpen);
  });

  // ---- Emulator ----
  sidemenuContent.appendChild(makeSectionLabel("Emulator"));
  const emuRow = makeSmRow("/imgs/icons/raspberry-pi.svg", "emulator", true);
  sidemenuContent.appendChild(emuRow);
  const emuSub = document.createElement("div");
  emuSub.className = "sm-sub";
  EMULATORS.forEach(emu => {
    const row = document.createElement("div");
    row.className = "sm-sub-row" + (emu.name === null ? " sm-remove-emu" : "");
    row.textContent = emu.label;
    row.addEventListener("click", () => {
      closeSidemenu();
      selectEmulator(emu.name);
    });
    emuSub.appendChild(row);
  });
  sidemenuContent.appendChild(emuSub);
  emuRow.addEventListener("click", e => {
    e.stopPropagation();
    const isOpen = emuSub.classList.toggle("sm-open");
    emuRow.classList.toggle("sm-open", isOpen);
  });

  // ---- Actions ----
  sidemenuContent.appendChild(makeSectionLabel("Actions"));
  const refreshRow = makeSmRow("/imgs/icons/refresh.svg", "refresh");
  refreshRow.addEventListener("click", () => {
    closeSidemenu();
    document.getElementById("btn-refresh").click();
  });
  sidemenuContent.appendChild(refreshRow);

  const saveRow = makeSmRow("/imgs/icons/content-save.svg", "save");
  saveRow.addEventListener("click", () => {
    closeSidemenu();
    document.getElementById("btn-save").click();
  });
  sidemenuContent.appendChild(saveRow);

  const dlRow = makeSmRow("/imgs/icons/download.svg", "download");
  dlRow.addEventListener("click", () => {
    closeSidemenu();
    document.getElementById("btn-download").click();
  });
  sidemenuContent.appendChild(dlRow);

  // ---- Links ----
  sidemenuContent.appendChild(makeSectionLabel("Links"));
  const linksDiv = document.createElement("div");
  linksDiv.className = "sm-links";
  const taLink = document.createElement("a");
  taLink.href = "https://mz4u.net";
  taLink.target = "_blank";
  const taImgDiv = document.createElement("div");
  taImgDiv.style.cssText = "width:20px;height:20px;background:url(/imgs/icon.png) center/contain no-repeat;flex-shrink:0;";
  taLink.appendChild(taImgDiv);
  taLink.appendChild(document.createTextNode("mz4u.net"));
  linksDiv.appendChild(taLink);
  const ghLink = document.createElement("a");
  ghLink.href = "https://github.com/tadfmac/web-pio";
  ghLink.target = "_blank";
  const ghImgDiv = document.createElement("div");
  ghImgDiv.style.cssText = "width:20px;height:20px;background:url(/imgs/github-logo.png) center/contain no-repeat;flex-shrink:0;";
  ghLink.appendChild(ghImgDiv);
  ghLink.appendChild(document.createTextNode("GitHub"));
  linksDiv.appendChild(ghLink);
  sidemenuContent.appendChild(linksDiv);
}

// ---- init ----
bridgeFrame.addEventListener("load", () => {
  bridgeReady = true;
});

requestAnimationFrame(() => {
  initLayout();
  initSplitters();
  initFromQuery();
});

</script>
</body>
</html>
