<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>pio-emu test</title>
<style>
body{margin:0;padding:16px;background:#f0f0f0;font-family:sans-serif;box-sizing:border-box;}
h1{font-size:16px;margin:0 0 12px;}
.boards{display:flex;flex-wrap:wrap;gap:16px;}
.board-wrap{background:#fff;border:1px solid #ccc;padding:8px;border-radius:4px;}
.board-wrap h2{font-size:13px;margin:0 0 6px;color:#333;}
.viewer-container{width:100%;height:400px;resize:both;overflow:hidden;min-width:100px;min-height:100px;}
.viewer-container.pico{width:100%;height:550px;}
.controls{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;}
.controls button{font-size:11px;padding:2px 6px;cursor:pointer;}
.event-log{margin-top:16px;background:#fff;border:1px solid #ccc;border-radius:4px;padding:8px;}
.event-log h2{font-size:13px;margin:0 0 6px;color:#333;}
#log-list{font-size:11px;font-family:monospace;max-height:120px;overflow-y:auto;margin:0;padding:0;list-style:none;}
#log-list li{padding:1px 0;border-bottom:1px solid #f0f0f0;color:#333;}
</style>
</head>
<body>
<h1>pio-emu emuViewer test</h1>
<div class="event-log">
<h2>onGPIOChange イベントログ</h2>
<ul id="log-list"></ul>
</div>
<div class="boards" id="boards"></div>
<script type="module">
import {emuViewer} from '../libs/emulator-viewer.mjs';

const logList = document.getElementById('log-list');
function logEvent(deviceName, pinNum, direction, value) {
  const li = document.createElement('li');
  li.textContent = `[${deviceName}] GPIO${pinNum} direction=${direction} value=${value}`;
  logList.prepend(li);
  if (logList.children.length > 50) logList.lastChild.remove();
}

const boards = [
  {name:'pio_xiaoRP2040', label:'XIAO RP2040'},
  {name:'pio_xiaoRP2350', label:'XIAO RP2350'},
  {name:'pio_xiaoESP32C6', label:'XIAO ESP32C6'},
  {name:'pio_RaspiPico', label:'Raspi Pico', pico:true},
  {name:'pio_RaspiPico2', label:'Raspi Pico2', pico:true},
];

const viewers = {};

for(const b of boards){
  const wrap = document.createElement('div');
  wrap.className = 'board-wrap';

  const h2 = document.createElement('h2');
  h2.textContent = b.label;
  wrap.appendChild(h2);

  const container = document.createElement('div');
  container.className = b.pico ? 'viewer-container pico' : 'viewer-container';
  wrap.appendChild(container);

  const controls = document.createElement('div');
  controls.className = 'controls';

  document.getElementById('boards').appendChild(wrap);

  const viewer = new emuViewer(container, b.name);
  await viewer.init();
  viewer.setOnGPIOChange(logEvent);
  viewers[b.name] = viewer;

  const pins = viewer.getPins();
  const testPins = [...pins.left.slice(0, 2), ...pins.right.slice(0, 2)];
  const allGpios = [...pins.left, ...pins.right].map(p => p.gpio);

  for(const {gpio, label} of testPins){
    const btn = document.createElement('button');
    btn.textContent = `${label} out HIGH`;
    btn.onclick = async () => { await viewer.set(gpio, 'out', 1); };
    controls.appendChild(btn);

    const btn2 = document.createElement('button');
    btn2.textContent = `${label} out LOW`;
    btn2.onclick = async () => { await viewer.set(gpio, 'out', 0); };
    controls.appendChild(btn2);

    const btn3 = document.createElement('button');
    btn3.textContent = `${label} in`;
    btn3.onclick = async () => { await viewer.set(gpio, 'in', null); };
    controls.appendChild(btn3);

    const btn4 = document.createElement('button');
    btn4.textContent = `${label} in-pullup`;
    btn4.onclick = async () => { await viewer.set(gpio, 'in-pullup', null); };
    controls.appendChild(btn4);

    const btn5 = document.createElement('button');
    btn5.textContent = `${label} adc 128`;
    btn5.onclick = async () => { await viewer.set(gpio, 'adc', 128); };
    controls.appendChild(btn5);
  }

  const btnPwm = document.createElement('button');
  btnPwm.textContent = `${testPins[0].label} pwm 128`;
  btnPwm.onclick = async () => { await viewer.set(testPins[0].gpio, 'pwm', 128); };
  controls.appendChild(btnPwm);

  const btnNone = document.createElement('button');
  btnNone.textContent = 'reset all';
  btnNone.onclick = async () => {
    for(const g of allGpios) await viewer.set(g, 'none', null);
  };
  controls.appendChild(btnNone);

  wrap.appendChild(controls);
}

</script>
</body>
</html>
