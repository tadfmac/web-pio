<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>pio-emu bridge</title>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:8px;background:#f5f5f5;font-family:sans-serif;}
#emu-container{display:flex;flex-wrap:wrap;gap:8px;}
.emu-device{background:#fff;border:1px solid #ccc;border-radius:4px;padding:4px;min-width:200px;min-height:200px;}
</style>
</head>
<body>
<div id="emu-container"></div>
<script type="module">
import Pio from "../libs/pio.mjs";

const pio = new Pio();
const result = await pio.init({mode:"bridge"});
if(!result){
  console.error("pio bridge init failed");
}
</script>
</body>
</html>
